<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | InsightLab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="nav-container">
      <a href="./index.html" class="logo-area">
        <span>InsightLab</span>
        <span class="logo-badge">PRO REPORT</span>
      </a>
      <ul class="nav-links">
        <li><a href="./index.html">홈</a></li>
        <li><a href="./posts.html">보고서 목록</a></li>
        <li><a href="./archive.html">아카이브 Matrix</a></li>
        <li><a href="./editor.html">보고서 작성</a></li>
      </ul>
      <div class="nav-actions">
        <a href="./login.html" class="btn btn-outline btn-sm active">로그인</a>
        <a href="./signup.html" class="btn btn-primary btn-sm">회원가입</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="form-card">
      <div class="form-header">
        <h1>회원가입</h1>
        <p style="color:var(--text-muted);margin-top:.5rem">InsightLab 계정을 만들어 보고서를 작성해 보세요.</p>
      </div>
      <div id="error-message" role="alert" style="display:none;color:#b91c1c;background:#fef2f2;padding:.75rem;border-radius:8px;margin-bottom:1rem"></div>
      <form id="signup-form">
        <div class="form-group"><label class="form-label" for="name">이름</label><input class="form-input" id="name" autocomplete="name" required maxlength="100"></div>
        <div class="form-group"><label class="form-label" for="email">이메일</label><input class="form-input" id="email" type="email" autocomplete="email" required maxlength="254"></div>
        <div class="form-group"><label class="form-label" for="password">비밀번호</label><input class="form-input" id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="256" placeholder="8자 이상"></div>
        <div class="form-group"><label class="form-label" for="confirm">비밀번호 확인</label><input class="form-input" id="confirm" type="password" autocomplete="new-password" required minlength="8"></div>
        <button type="submit" class="btn btn-primary" style="width:100%">회원가입</button>
      </form>
      <p style="margin-top:1.5rem;text-align:center;color:var(--text-muted)">이미 계정이 있으신가요? <a href="./login.html" style="color:var(--accent-blue)">로그인</a></p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand">
        <div class="footer-logo">InsightLab Report</div>
        <p>글로벌 산업 트렌드, 기술 혁신, 사회문화 웰니스 현안 분석 리포트</p>
      </div>
    </div>
    <div class="footer-bottom">&copy; 2025 InsightLab Professional Platform.</div>
  </footer>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget, button = form.querySelector('button'), error = document.getElementById('error-message');
      error.style.display = 'none';
      const name = document.getElementById('name').value.trim(), email = document.getElementById('email').value.trim(), password = document.getElementById('password').value;
      if (password !== document.getElementById('confirm').value) { error.textContent = '비밀번호가 일치하지 않습니다.'; error.style.display = 'block'; return; }
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,email,password}) });
        const data = await response.json();
        if (!response.ok || !data.user) throw new Error(data.error || '가입에 실패했습니다.');
        alert('회원가입이 완료되었습니다.');
        location.href = './index.html';
      } catch (e) { error.textContent = e.message || '서버에 연결할 수 없습니다.'; error.style.display = 'block'; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
