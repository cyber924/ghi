<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | InsightLab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="nav-container">
      <a href="./index.html" class="logo-area">
        <span>InsightLab</span>
        <span class="logo-badge">PRO REPORT</span>
      </a>
      <ul class="nav-links">
        <li><a href="./index.html">홈</a></li>
        <li><a href="./posts.html">보고서 목록</a></li>
        <li><a href="./archive.html">아카이브 Matrix</a></li>
        <li><a href="./editor.html">보고서 작성</a></li>
      </ul>
      <div class="nav-actions">
        <a href="./login.html" class="btn btn-outline btn-sm active">로그인</a>
        <a href="./signup.html" class="btn btn-primary btn-sm">회원가입</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="form-card">
      <div class="form-header">
        <h1 style="font-size:1.75rem; font-weight:800; color:var(--primary-900);">로그인</h1>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.4rem;">InsightLab 전문 연구원 및 독자 계정으로 접속하세요.</p>
      </div>

      <div id="error-message" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:0.75rem 1rem; border-radius:var(--radius-md); font-size:0.875rem; margin-bottom:1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">이메일 주소</label>
          <input type="email" id="email" class="form-input" placeholder="researcher@insightlab.org" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem; padding:0.8rem;">로그인하기</button>
      </form>

      <div style="margin-top:1.5rem; text-align:center; font-size:0.875rem; color:var(--text-muted);">
        아직 계정이 없으신가요? <a href="./signup.html" style="color:var(--accent-blue); font-weight:600;">회원가입</a>
      </div>


    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand">
        <div class="footer-logo">InsightLab Report</div>
        <p>글로벌 산업 트렌드, 기술 혁신, 사회문화 웰니스 현안 분석 리포트</p>
      </div>
    </div>
    <div class="footer-bottom">&copy; 2025 InsightLab Professional Platform.</div>
  </footer>

  <script src="./app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errBox = document.getElementById('error-message');
        errBox.style.display = 'none';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (res.ok && data.user) {
            alert('성공적으로 로그인되었습니다.');
            window.location.href = './index.html';
            return;
          } else {
            errBox.textContent = data.error || '로그인에 실패하였습니다.';
            errBox.style.display = 'block';
          }
        } catch (e) {
          errBox.textContent = '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.';
          errBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
